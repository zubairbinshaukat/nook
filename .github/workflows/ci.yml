name: CI

# Checks every pull request and every push to main. Builds nothing that is
# published and uses no secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - run: npm ci

      # The relay is bundled as a resource, so the app's build script wants it built first.
      - run: cargo build --release -p nook-hook

      - run: npx tsc --noEmit

      - run: npx vite build

      - run: cargo test --workspace

      # Never run locally yet (clippy is not installed on the dev machine), so it
      # reports without failing the check. Drop continue-on-error once it is clean.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true
